<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ตารางเวรหน่วยกู้ชีพเทศบาลตำบลสามขา</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12 antialiased">

  <!-- ส่วนหัวเว็บ -->
  <header class="bg-red-600 text-white pt-6 pb-5 px-4 text-center shadow-md sticky top-0 z-30">
    <!-- ของใหม่ -->
    <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-full p-1 mb-2 shadow-md">
    <img src="logo samkha.png" alt="โลโก้เทศบาลตำบลสามขา" class="w-full h-full object-contain rounded-full">
    </div>
    <h1 class="text-xl font-bold tracking-tight">หน่วยกู้ชีพเทศบาลตำบลสามขา</h1>
    <p class="text-xs text-red-100">ตารางเจ้าหน้าที่เข้าเวรประจำวัน</p>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4 space-y-4">

    <!-- แถบเบอร์ฉุกเฉิน 1669 เด่นชัดด้านบนสุด -->
    <div class="bg-red-50 border-2 border-red-500 rounded-2xl p-4 flex items-center justify-between shadow-sm">
      <div>
        <span class="inline-block bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full mb-1">อุบัติเหตุ / เจ็บป่วยฉุกเฉิน</span>
        <p class="text-xl font-black text-red-900 leading-tight">โทรฟรี 1669</p>
      </div>
      <a href="tel:1669" class="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold px-5 py-2.5 rounded-xl shadow-md text-sm flex items-center gap-1.5 transition">
        <span>📞</span> โทรทันที
      </a>
    </div>

    <!-- วันที่ปัจจุบัน -->
    <div class="bg-white rounded-xl py-2.5 px-4 shadow-sm text-center border border-slate-200">
      <span class="text-xs text-slate-400 block">ข้อมูลเวรประจำวัน</span>
      <p id="date-display" class="text-sm font-semibold text-slate-700">กำลังตรวจสอบข้อมูล...</p>
    </div>

    <!-- กล่องโหลดข้อมูล -->
    <div id="loading" class="text-center py-10 text-slate-400">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-red-500 border-t-transparent mb-2"></div>
      <p class="text-xs">กำลังโหลดรายชื่อเจ้าหน้าที่...</p>
    </div>

    <!-- คอนเทนเนอร์แสดงเวรทั้ง 2 ช่วง -->
    <div id="duty-content" class="space-y-6 hidden">
      
      <!-- หมวด: เวรเช้า -->
      <section>
        <div class="flex items-center justify-between mb-2 px-1">
          <div class="flex items-center gap-2">
            <span class="text-lg">☀️</span>
            <h2 class="font-bold text-slate-800 text-base">เวรเช้า (06.00 - 14.00 น.)</h2>
          </div>
          <span id="badge-morning" class="hidden text-[11px] bg-emerald-100 text-emerald-700 font-bold px-2.5 py-0.5 rounded-full border border-emerald-300 animate-pulse">
            ● กำลังเข้าเวร
          </span>
        </div>
        <div id="morning-list" class="space-y-2.5"></div>
      </section>

      <!-- หมวด: เวรบ่าย -->
      <section>
        <div class="flex items-center justify-between mb-2 px-1">
          <div class="flex items-center gap-2">
            <span class="text-lg">⛅</span>
            <h2 class="font-bold text-slate-800 text-base">เวรบ่าย (14.00 - 22.00 น.)</h2>
          </div>
          <span id="badge-afternoon" class="hidden text-[11px] bg-emerald-100 text-emerald-700 font-bold px-2.5 py-0.5 rounded-full border border-emerald-300 animate-pulse">
            ● กำลังเข้าเวร
          </span>
        </div>
        <div id="afternoon-list" class="space-y-2.5"></div>
      </section>

    </div>

  </main>

  <script>
    // ⚠️ นำ URL เว็บแอป Google Apps Script ของคุณมาวางตรงนี้
    const SCRIPT_URL = "วาง_URL_เว็บแอปของคุณ_ตรงนี้";

    async function fetchDuty() {
      const loading = document.getElementById("loading");
      const dutyContent = document.getElementById("duty-content");

      // 1. ดึงข้อมูลที่จำไว้ในเครื่องมาโชว์ทันทีใน 0.05 วินาที
      const cachedData = localStorage.getItem("ems_cached_roster");
      if (cachedData) {
        try {
          const parsed = JSON.parse(cachedData);
          applyDutyData(parsed);
          loading.classList.add("hidden");
          dutyContent.classList.remove("hidden");
        } catch (e) {
          console.error(e);
        }
      }

      // 2. ดึงข้อมูลสดใหม่มาอัปเดตทับเบื้องหลัง
      try {
        const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
        const data = await res.json();

        localStorage.setItem("ems_cached_roster", JSON.stringify(data));

        applyDutyData(data);
        loading.classList.add("hidden");
        dutyContent.classList.remove("hidden");

      } catch (err) {
        console.error(err);
        if (!cachedData) {
          loading.innerHTML = `
            <div class="bg-amber-50 border border-amber-300 rounded-xl p-4 text-amber-800 text-xs text-center font-medium">
              ไม่สามารถเชื่อมต่อตารางเวรได้ในขณะนี้ กรุณาโทรสายด่วน 1669
            </div>
          `;
        }
      }
    }

    function applyDutyData(data) {
      const dateDisplay = document.getElementById("date-display");
      const todayDate = new Date();
      dateDisplay.innerText = todayDate.toLocaleDateString("th-TH", {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      const badgeMorning = document.getElementById("badge-morning");
      const badgeAfternoon = document.getElementById("badge-afternoon");

      if (badgeMorning && badgeAfternoon) {
        badgeMorning.classList.toggle("hidden", data.activeShift !== "เช้า");
        badgeAfternoon.classList.toggle("hidden", data.activeShift !== "บ่าย");
      }

      renderList("morning-list", data.morningStaff, data.activeShift === "เช้า");
      renderList("afternoon-list", data.afternoonStaff, data.activeShift === "บ่าย");
    }

    function renderList(containerId, staffArray, isActiveShift) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if (!staffArray || staffArray.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl p-4 text-center text-xs text-slate-400 border border-dashed border-slate-300">
            ไม่มีรายชื่อเจ้าหน้าที่ในเวรนี้
          </div>
        `;
        return;
      }

      staffArray.forEach((person, index) => {
        const card = document.createElement("div");
        const borderStyle = isActiveShift ? "border-emerald-300 shadow-sm ring-1 ring-emerald-200" : "border-slate-200";

        card.className = `bg-white rounded-2xl p-3 border ${borderStyle} flex items-center justify-between gap-3`;
        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <img src="${person.image}" alt="${person.name}" 
                 class="w-14 h-14 rounded-full object-cover border border-slate-200 shadow-sm bg-slate-50 flex-shrink-0"
                 onerror="this.src='https://cdn-icons-png.flaticon.com/512/847/847969.png'">
            <div class="min-w-0">
              <span class="text-[11px] font-semibold text-slate-500 block leading-tight">คนที่ ${index + 1} : ${person.role}</span>
              <h3 class="text-sm font-bold text-slate-800 truncate">${person.name}</h3>
              <p class="text-xs font-medium text-slate-500 mt-0.5">${person.phone}</p>
            </div>
          </div>
          
          <a href="tel:${person.phone}" 
             class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-medium px-4 py-2 rounded-xl text-xs flex items-center gap-1 shadow flex-shrink-0 transition">
            <span>📞</span> โทร
          </a>
        `;
        container.appendChild(card);
      });
    }

    fetchDuty();

    // ระบบ PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.log(err));
    }
  </script>
</body>
</html>
